<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Permission Configuration Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1250px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 6px;
            color: #0f172a;
        }

        p.subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 24px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        th, td {
            padding: 10px 10px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 700;
        }

        .super-header {
            text-align: center;
            border-bottom: 2px solid #cbd5e1;
        }

        .user-group {
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .admin-group {
            background-color: #fef2f2;
            color: #b91c1c;
        }

        /* Checkbox & Dynamic Label Style */
        .check-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .check-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #16a34a;
            cursor: pointer;
        }

        .status-text {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            min-width: 58px;
        }

        .status-text.editable {
            color: #15803d;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: 0.2s ease;
        }

        .btn-submit {
            background-color: #2563eb;
            color: white;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-reset {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-copy {
            background-color: #10b981;
            color: white;
        }

        .output-box {
            display: none;
            background-color: #0f172a;
            color: #38bdf8;
            padding: 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Field Permissions Matrix Form</h2>
    <p class="subtitle">Default is <strong>Read only</strong> (Unchecked). Check the box to make it <strong>Editable</strong>.</p>

    <form id="matrixForm">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2">Field Name</th>
                        <th colspan="5" class="super-header user-group">USER SECTION</th>
                        <th colspan="5" class="super-header admin-group">ADMIN SECTION</th>
                    </tr>
                    <tr>
                        <!-- User Columns with History next to Holding -->
                        <th>Open Position</th>
                        <th>Activated</th>
                        <th>Holding</th>
                        <th>History</th>
                        <th>Rejected</th>

                        <!-- Admin Columns with History next to Holding -->
                        <th>Open Position</th>
                        <th>Activated</th>
                        <th>Holding</th>
                        <th>History</th>
                        <th>Rejected</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamically injected via JS -->
                </tbody>
            </table>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-submit" onclick="generateJSON()">Submit & Generate JSON</button>
            <button type="button" class="btn-reset" onclick="resetAll()">Reset All to Read only</button>
            <button type="button" class="btn-copy" id="copyBtn" style="display:none;" onclick="copyJSON()">Copy JSON</button>
        </div>
    </form>

    <pre id="jsonOutput" class="output-box"></pre>
</div>

<script>
    const fields = [
        "USER",
        "SEGMENT",
        "TYPE",
        "QTY",
        "BUY",
        "BUY TIME",
        "SELL",
        "SELL TIME",
        "TARGET",
        "STOP LOSS",
        "P/L",
        "STATUS"
    ];

    // Added History directly beside Holding
    const columns = [
        { section: "User", tab: "Open Position" },
        { section: "User", tab: "Activated" },
        { section: "User", tab: "Holding" },
        { section: "User", tab: "History" },
        { section: "User", tab: "Rejected" },

        { section: "Admin", tab: "Open Position" },
        { section: "Admin", tab: "Activated" },
        { section: "Admin", tab: "Holding" },
        { section: "Admin", tab: "History" },
        { section: "Admin", tab: "Rejected" }
    ];

    const tableBody = document.getElementById("tableBody");

    // Build Table Rows
    fields.forEach((field, fIdx) => {
        const tr = document.createElement("tr");
        let html = `<td><strong>${field}</strong></td>`;
        
        columns.forEach((col, cIdx) => {
            const checkId = `chk_${fIdx}_${cIdx}`;
            html += `
                <td>
                    <label class="check-container" for="${checkId}">
                        <input type="checkbox" id="${checkId}" 
                               data-field="${field}" 
                               data-section="${col.section}" 
                               data-tab="${col.tab}" 
                               onchange="onCheckChange(this)">
                        <span class="status-text" id="lbl_${checkId}">Read only</span>
                    </label>
                </td>
            `;
        });
        tr.innerHTML = html;
        tableBody.appendChild(tr);
    });

    // Toggle Label on Check/Uncheck
    function onCheckChange(chk) {
        const label = document.getElementById(`lbl_${chk.id}`);
        if (chk.checked) {
            label.textContent = "Editable";
            label.classList.add("editable");
        } else {
            label.textContent = "Read only";
            label.classList.remove("editable");
        }
    }

    // Reset All back to Read Only
    function resetAll() {
        document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
            chk.checked = false;
            onCheckChange(chk);
        });
        document.getElementById("jsonOutput").style.display = "none";
        document.getElementById("copyBtn").style.display = "none";
    }

    // Generate JSON on Submit
    function generateJSON() {
        const result = {
            metadata: {
                form_type: "Field Permissions Matrix",
                submitted_at: new Date().toISOString()
            },
            permissions: {}
        };

        // Initialize structure
        fields.forEach(field => {
            result.permissions[field] = {
                User: {
                    "Open Position": "Read only",
                    "Activated": "Read only",
                    "Holding": "Read only",
                    "History": "Read only",
                    "Rejected": "Read only"
                },
                Admin: {
                    "Open Position": "Read only",
                    "Activated": "Read only",
                    "Holding": "Read only",
                    "History": "Read only",
                    "Rejected": "Read only"
                }
            };
        });

        // Collect Values
        document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
            const field = chk.getAttribute("data-field");
            const section = chk.getAttribute("data-section");
            const tab = chk.getAttribute("data-tab");
            
            // Checkbox checked = Editable, Unchecked = Read only
            result.permissions[field][section][tab] = chk.checked ? "Editable" : "Read only";
        });

        const jsonString = JSON.stringify(result, null, 2);
        
        // Output to Browser Console (for dev checking)
        console.log("Submitted Configuration JSON:", result);

        // Display in UI
        const outputPre = document.getElementById("jsonOutput");
        outputPre.textContent = jsonString;
        outputPre.style.display = "block";
        document.getElementById("copyBtn").style.display = "inline-block";
        outputPre.scrollIntoView({ behavior: "smooth" });

        alert("Permissions submitted successfully! JSON generated below.");
    }

    // Copy JSON Helper
    function copyJSON() {
        const outputText = document.getElementById("jsonOutput").textContent;
        navigator.clipboard.writeText(outputText).then(() => {
            alert("JSON copied to clipboard!");
        });
    }
</script>

</body>
</html>
